#To use this config, during "make menuconfig" select the
# STM32F103 with a "28KiB bootloader" and serial (on USART1 PA10/PA9)
# communication.

# If you prefer a direct serial connection, in "make menuconfig"
# select "Enable extra low-level configuration options" and select
# serial (on USART3 PB11/PB10), which is broken out on the 10 pin IDC
# cable used for the LCD module as follows:
# 3: Tx, 4: Rx, 9: GND, 10: VCC


# See docs/Config_Reference.md for a description of parameters.
[include KAMP_Settings.cfg]


[mcu]
serial:/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[temperature_sensor host_temp]
sensor_type: temperature_host

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 8000
max_z_velocity: 15
max_z_accel: 100
square_corner_velocity:3.0

[virtual_sdcard] 
path:/home/mks/printer_data/gcodes

[pause_resume]

[display_status]

[idle_timeout]
gcode:
    RESPOND TYPE=echo MSG="No operations in 10min!"
#   A list of G-Code commands to execute on an idle timeout. See
#   docs/Command_Templates.md for G-Code format. The default is to run
#   "TURN_OFF_HEATERS" and "M84".
timeout: 600

[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None
spi_bus: spidev0.0

[verify_heater extruder]
max_error: 60
check_gain_time:20
hysteresis: 5
heating_gain: 2

[verify_heater heater_bed]
max_error: 60
check_gain_time:40
hysteresis: 5
heating_gain: 2

[resonance_tester]
accel_chip: adxl345
probe_points:
    115, 115, 20  # an example
accel_per_hz:50
min_freq:1
max_freq:100
max_smoothing:0.2
hz_per_sec:0.5

[respond]
#default_type: echo
#   Sets the default prefix of the "M118" and "RESPOND" output to one
#   of the following:
#       echo: "echo: " (This is the default)
#       command: "// "
#       error: "error!"
#default_prefix: echo:
#   Directly sets the default prefix. If present, this value will
#   override the "default_type".

#############################################################################################################
#GCODE_MACRO
#############################################################################################################
# [gcode_macro SHAPER_CALIBRATE]
# rename_existing: RESHAPER_CALIBRATE
# gcode:
#      RESHAPER_CALIBRATE FREQ_START=50 FREQ_END=150

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE
    RESPOND TYPE=echo MSG="Cancel Print Success!"
    G91 ;Relative positionning
    G1 E-2 F500 ;Retract a bit
    G1 E-2 Z0.2 F200 ;Retract and raise Z
    G1 Z1 ;Raise Z more
    M106 S0 ;Turn-off fan
    M104 S0 ;Turn-off hotend
    M140 S0 ;Turn-off bed
    G90
    G1 X10 Y210 F6000
    M84 X Y E ;Disable all steppers but Z


[gcode_macro WIPE_NOZZLE]
gcode:
    {% set wipe_y = 231 %}
    {% set wipe_x_start = -10 %}
    {% set wipe_x_end = 20 %}
    {% set wipe_z = 8.8 %}
    {% set old_pos = printer.gcode_move.gcode_position %}

    G90
    G1 X{wipe_x_start} 
    G1 Y{wipe_y} F3000
    G1 Z{wipe_z} F3000

    {% for i in range(4) %}
    G1 X{wipe_x_end} F11000
    G1 X{wipe_x_start} F11000
    {% endfor %}

    G1 X{old_pos.x} F3000
    G1 Z{old_pos.z} F3000
    G1 Y{old_pos.y} F1200


[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.FIRST_LAYER_BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.FIRST_LAYER_EXT_TEMP|default(200)|float %}

    M84 E                          ; disable E motor for probe accuracy
    G90                             ; absolute positioning
    G92 E0
    G28                              ; home all axis (cold)

    G1 X-10 Y231 Z10 F3000        ; park near wipe brush while heat-soaking

    M140 S{BED_TEMP}          ; start heating bed (non-blocking)
    M104 S{EXTRUDER_TEMP}   ; start heating nozzle (non-blocking)
    M190 S{BED_TEMP}          ; wait for bed temp
    M109 S{EXTRUDER_TEMP}   ; wait for nozzle temp

    G91
    G1 E-7 F1800                     ; retract before wipe so no ooze
    G90

    WIPE_NOZZLE                      ; clean nozzle

    G28

    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=5   ; probe only the area around sliced objects

    LINE_PURGE

[gcode_macro PAUSE] 
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
    RESPOND TYPE=echo MSG="Pause Print!"
    ##### set defaults #####
    {% set x = params.X|default(0) %}       #edit to your park position
    {% set y = params.Y|default(210) %}     #edit to your park position
    {% set z = params.Z|default(100)|float %} #edit to your park position
    {% set e = params.E|default(1) %}        #edit to your retract length
    ##### calculate save lift position #####
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set lift_z = z|abs %}
    {% if act_z < (max_z - lift_z) %}
        {% set z_safe = lift_z %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    ##### end of definitions #####
    PAUSE_BASE
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-{e} F500
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}    
      G1 Z{z_safe}
      G90
      G1 X{x} Y{y} F6000
    {% else %}
      {action_respond_info("Printer not homed")}
    {% endif %}

[gcode_macro RESUME]  
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    RESPOND TYPE=echo MSG="RESUME Print!"
    ##### set defaults #####
    {% if True %} # detect if occur filament runout ,True : filament exists.  False:filament runout
      {% set e = params.E|default(1) %} #edit to your retract length
    #### get VELOCITY parameter if specified ####
      {% if 'VELOCITY' in params|upper %}
        {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
      {%else %}
        {% set get_params = "" %}
      {% endif %}
    ##### end of definitions #####
      G91
      {% if printer.extruder.can_extrude|lower == 'true' %}
        G1 E{e} F400
      {% else %}
        {action_respond_info("Extruder not hot enough")}
      {% endif %}   
      RESUME_BASE {get_params}
    {% endif %} 

[gcode_macro END_PRINT]
gcode:
    G91
    G1 E-2 F500
    G1 E-2 Z0.2 F200
    G1 X5 Y5 F3000
    G90
    {% set park_z = 100 %}
    {% set cur_z = printer.toolhead.position.z|float %}
    G1 Z{[park_z, cur_z]|max} F600
    G1 X0 Y210 F3000

    M106 S0
    M104 S0
    M140 S0

    M84 X Y E
    RESPOND TYPE=echo MSG="Finish Print!"

[gcode_macro LOAD_FILAMENT]
gcode:
    G91 
    G1 E30 F300
    G1 E10 F150
    G90

[gcode_macro UNLOAD_FILAMENT]
gcode:
    G91
    G1 E-30 F300
    G90

[gcode_macro FILAMENT_CHANGE]
description: Pause, park high, and unload filament for a color/spool change. Stays paused until RESUME is called.
gcode:
    {% set EXTRUDE_TEMP = params.TEMP|default(0)|float %}
    
    PAUSE Z=80   ; extra height for filament change access, beyond normal pause clearance
    
    {% if EXTRUDE_TEMP > 0 %}
        M109 S{EXTRUDE_TEMP}   ; optional: bump temp if you want it hotter for a smoother unload
    {% endif %}
    
    G91
    G1 E-2 F300      ; small retract first, reduces stringing before the full pull
    G1 E-50 F1200    ; unload filament clear of the hotend
    G90
    
    RESPOND TYPE=echo MSG="Filament unloaded. Insert new filament, run LOAD_FILAMENT, then RESUME."


[gcode_macro LED_ON]
gcode:
    SET_PIN PIN=my_led VALUE=1

[gcode_macro LED_OFF]
gcode:
    SET_PIN PIN=my_led VALUE=0

[gcode_macro M201]
gcode:
    # Marlin per-axis max accel — Klipper uses SET_VELOCITY_LIMIT instead. No-op.

[gcode_macro M203]
gcode:
    # Marlin per-axis max feedrate — Klipper uses SET_VELOCITY_LIMIT instead. No-op.

[gcode_macro M205]
gcode:
    # Marlin jerk settings — Klipper uses square_corner_velocity instead. No-op.


#############################################################################################################
#stepper,TMC2209
#############################################################################################################
[stepper_x]
step_pin: PD15
dir_pin: PD14
enable_pin: !PC7
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop 
homing_retract_dist: 0
position_endstop: -16
position_min: -16
position_max: 225
homing_speed: 50
#second_homing_speed: 25
step_pulse_duration:0.000004

[tmc2209 stepper_x]
uart_pin:PE3
run_current:1.3  
uart_address:3
interpolate: True
driver_sgthrs: 100
stealthchop_threshold: 999999
diag_pin: ^PD10 

[stepper_y]
step_pin: PB7
dir_pin: PB6
enable_pin: !PB9
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_retract_dist: 0
position_endstop: -2
position_min: -2
position_max: 235
homing_speed: 60
step_pulse_duration:0.000004

[tmc2209 stepper_y]
uart_pin:PE4
run_current:1.2  
uart_address:3
interpolate: True
driver_sgthrs: 110
stealthchop_threshold: 999999
diag_pin: ^PE0

[stepper_z]
step_pin: PB3
dir_pin: !PD7
enable_pin: !PB5
microsteps: 16
rotation_distance: 8
endstop_pin:probe:z_virtual_endstop
#position_endstop: 0.0
position_max: 253
position_min: -2
homing_speed:3

[stepper_z1]
step_pin: PA7
dir_pin: !PA6
enable_pin: !PC5
microsteps: 16
rotation_distance: 8
endstop_pin:probe:z_virtual_endstop
#position_endstop: 0.0

[tmc2209 stepper_z]
uart_pin: PE6
uart_address: 3
run_current: 1
interpolate: True
stealthchop_threshold: 0

[tmc2209 stepper_z1]
uart_pin: PE5
uart_address: 3
run_current: 1
interpolate: True
stealthchop_threshold: 0

[extruder]
max_extrude_only_distance: 100.0
step_pin: PD1
dir_pin: !PD0
enable_pin: !PD4
microsteps: 16
rotation_distance: 4.59
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA4
#control: pid
pressure_advance:0.02
pressure_advance_smooth_time:0.035
#max_extrude_cross_section:500
#instantaneous_corner_velocity:10
#max_extrude_only_distance: 100.0
#max_extrude_only_velocity:200
#max_extrude_only_accel:1000
#step_pulse_duration:0.000002
max_extrude_cross_section:5
# tuned for stock hardware with 200 degree Celsius target
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
#pid_Kp=24.522 
#pid_Ki=1.397 
#pid_Kd=107.590
min_temp: 0
max_temp: 300
min_extrude_temp: 150

[tmc2209 extruder]
uart_pin: PE7
run_current: 0.6
uart_address:3
#hold_current: 0.5
interpolate: True
stealthchop_threshold: 400

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA3
#control: pid
# tuned for stock hardware with 50 degree Celsius target
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

[probe]
pin:PD13
x_offset:27
y_offset:-20
#z_offset:1.1

[filament_switch_sensor my_sensor]
pause_on_runout: True
runout_gcode:
    RESPOND TYPE=error MSG="Filament Runout! Please change filament!"
event_delay: 3.0
pause_delay: 0.5
switch_pin: PD11

[safe_z_home]
home_xy_position: 83,130
speed: 100
z_hop: 20                 # Move up 5mm
z_hop_speed: 5

#################################################
#Z stepper tilt adjustment
#################################################
[z_tilt]
z_positions: -16, 135
             180, 135
points: -16, 135
        180, 135
speed: 200
horizontal_move_z: 5
retries: 20
retry_tolerance: .005

#################################################
#bed mesh calibrate
#################################################
[bed_mesh]
speed:200                
horizontal_move_z:5   
mesh_min:14,12     
mesh_max:210,202  
probe_count:5,5      
algorithm: bicubic   
bicubic_tension: 0.3
#fade_start: 0.2
#fade_end: 10
mesh_pps:4,4
move_check_distance: 3
#split_delta_z: .025

#################################################
#adjust bed screws tilt
#################################################
[screws_tilt_adjust]
screw1: -1, 45
screw1_name: front left screw
screw2: 168, 45
screw2_name: front right screw
screw3: 168, 215
screw3_name: rear right screw
screw4: -1, 215
screw4_name: rear left screw
horizontal_move_z: 5.
speed: 200.
screw_thread: CW-M4

[heater_fan hotend_fan]
pin: PE11

[fan]
pin: PE9

[output_pin my_led]
pin:PC4
pwm: 1
value:0.2
cycle_time: 0.010

[fan_generic extruder_partfan]
pin:PE13
max_power: 1.0
kick_start_time: 0.5

[controller_fan Fan_Board]
pin:PD3
fan_speed: 1.0
idle_timeout: 120
heater: heater_bed, extruder
stepper: stepper_x, stepper_y, stepper_z, stepper_z1

[gcode_macro M106]
rename_existing: M106.1
gcode:
    {% set s = params.S|default(255)|float %}
    {% set speed = (s / 255)|float %}
    M106.1 S{s}                                          ; small fan on PE9, full range as normal
    SET_FAN_SPEED FAN=extruder_partfan SPEED={ [speed * 0.6, 1.0]|min }   ; loud fan on PE13, capped at 70%

[gcode_macro M107]
rename_existing: M107.1
gcode:
    M107.1
    SET_FAN_SPEED FAN=extruder_partfan SPEED=0

[input_shaper]
damping_ratio_x: 0.1
damping_ratio_y: 0.1

[virtual_pins]

[exclude_object]

